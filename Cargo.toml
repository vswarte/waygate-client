[package]
name = "waygate-client"
edition = "2021"
version = "0.1.0"

[lib]
crate-type = ["cdylib", "lib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[dependencies]
toml = "0.7.2"
thiserror = "1"
steamworks = "0.10"
steamworks-sys = "0.10"
tracing = "0.1"
tracing-appender = "0.2"
tracing-panic = "0.1"
tracing-subscriber = "0.3"
base64 = "0.22"
pelite = "0.10"
bincode = "1"
vtable-rs = "0.1"
aes = "0.8"
crc = "3"
byteorder = "1.5"
ctr = "0.9"
dashmap = "6.1"
crossbeam-channel = "0.5.15"

[dependencies.serde]
version = "1.0"
features = [
    "derive",
]

[dependencies.retour]
version = "0.3"
features = [
    "static-detour",
]

[dependencies.windows]
version = "0.61.1"
features = [
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Networking_WinHttp",
]

[dependencies.fromsoftware-shared]
version = "0.11"
git = "https://github.com/vswarte/fromsoftware-rs"
branch = "main"

[dependencies.eldenring]
version = "0.11"
git = "https://github.com/vswarte/fromsoftware-rs"
branch = "main"


[patch.crates-io]
libudis86-sys = { git = "https://github.com/vars1ty/libudis86-sys.git" }

[features]
default = ["eldenring"]
eldenring = []
armoredcore6 = []
lib = []
